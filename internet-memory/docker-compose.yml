version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: internet-memory-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: internet-memory-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/internet-memory
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_12345}
    depends_on:
      - mongodb
    restart: always

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: internet-memory-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: always

volumes:
  mongo-data:
